<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vishwak.log</title>
    <meta name="description" content="computer science · software engineering · fiction · thoughts" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- code syntax highlighting theme -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css"
    />

    <style>
      :root {
        --bg: #16120c;
        --bg-2: #1f1a13;
        --fg: #e8e0d2;
        --fg-dim: #9b9384;
        --amber: #e0a85e;
        --amber-soft: #d8b483;
        --green: #8faa6a;
        --rule: #2c2619;
        --rule-soft: #221d14;
        --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --sans: "IBM Plex Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        --measure: 68ch;
        --pad: clamp(1.1rem, 4vw, 2rem);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--sans);
        font-size: 17px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      ::selection { background: var(--amber); color: var(--bg); }
      .wrap { width: 100%; max-width: 860px; margin-inline: auto; padding-inline: var(--pad); }
      main.wrap { flex: 1 0 auto; padding-block: clamp(2.5rem, 7vw, 4.5rem); }
      a {
        color: var(--amber); text-decoration: none;
        border-bottom: 1px solid color-mix(in srgb, var(--amber) 40%, transparent);
        transition: background-color .12s ease, color .12s ease, border-color .12s ease;
      }
      a:hover, a:focus-visible {
        background: var(--amber); color: var(--bg); border-color: var(--amber); outline: none;
      }
      :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

      /* top bar */
      .topbar {
        border-bottom: 1px solid var(--rule);
        background: color-mix(in srgb, var(--bg) 90%, black);
        position: sticky; top: 0; z-index: 50; backdrop-filter: blur(6px);
      }
      .topbar__inner {
        display: flex; align-items: center; justify-content: space-between;
        gap: 1rem; padding-block: .85rem; flex-wrap: wrap;
      }
      .prompt { font-family: var(--mono); font-size: .95rem; font-weight: 500; border: 0; white-space: nowrap; }
      .prompt:hover { background: transparent; color: inherit; }
      .prompt .u { color: var(--green); }
      .prompt .at, .prompt .p { color: var(--fg-dim); }
      .prompt .h { color: var(--amber); }
      .prompt .s { color: var(--fg); margin-left: .35ch; }
      .nav { display: flex; gap: 1.1rem; font-family: var(--mono); font-size: .9rem; }
      .nav a { border-bottom: 0; color: var(--fg-dim); }
      .nav a:hover { color: var(--bg); background: var(--amber); }

      /* shell session */
      .session { font-family: var(--mono); font-size: .95rem; margin-bottom: 2rem; }
      .session .line { margin-bottom: .35rem; }
      .session .ps1 { color: var(--green); margin-right: .6ch; }
      .session .out { color: var(--fg-dim); max-width: var(--measure); margin: .2rem 0 1.4rem; }
      .comment { color: var(--fg-dim); }
      .cursor { color: var(--amber); margin-left: .4ch; animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      /* post listing */
      .filelist { list-style: none; font-family: var(--mono); border-top: 1px solid var(--rule-soft); }
      .filelist li { border-bottom: 1px solid var(--rule-soft); }
      .filelist a {
        display: grid; grid-template-columns: 6.5rem 1fr auto; gap: .5rem 1.2rem;
        align-items: baseline; padding: .85rem .4rem; border: 0; color: var(--fg);
      }
      .filelist a:hover { background: var(--bg-2); color: var(--fg); }
      .filelist a:hover .name { color: var(--amber); }
      .date { color: var(--fg-dim); font-size: .82rem; }
      .name { font-family: var(--sans); font-weight: 500; font-size: 1.02rem; }
      .cat { color: var(--green); font-size: .8rem; white-space: nowrap; }

      /* single post */
      .crumb { font-family: var(--mono); font-size: .85rem; margin-bottom: 1.4rem; }
      .crumb a { border-bottom: 0; color: var(--fg-dim); }
      .crumb a:hover { background: var(--amber); color: var(--bg); }
      .post__title {
        font-family: var(--sans); font-weight: 600;
        font-size: clamp(1.7rem, 4.5vw, 2.5rem); line-height: 1.15;
        letter-spacing: -.01em; margin-bottom: .6rem;
      }
      .post__meta { font-family: var(--mono); font-size: .85rem; color: var(--fg-dim); margin-bottom: 2.2rem; }

      /* prose (rendered markdown) */
      .prose { max-width: var(--measure); }
      .prose > * + * { margin-top: 1.15rem; }
      .prose h2 { font-family: var(--sans); font-size: 1.35rem; font-weight: 600; margin-top: 2.4rem; }
      .prose h2::before { content: "## "; color: var(--green); font-family: var(--mono); }
      .prose h3 { font-family: var(--sans); font-size: 1.12rem; font-weight: 600; margin-top: 1.8rem; }
      .prose h3::before { content: "### "; color: var(--green); font-family: var(--mono); }
      .prose strong { color: var(--amber-soft); font-weight: 600; }
      .prose ul, .prose ol { padding-left: 1.4rem; }
      .prose li + li { margin-top: .5rem; }
      .prose ul li::marker { color: var(--green); }
      .prose blockquote { border-left: 2px solid var(--amber); padding: .2rem 0 .2rem 1.1rem; color: var(--fg-dim); font-style: italic; }
      .prose a { text-underline-offset: 3px; }
      .prose :not(pre) > code {
        font-family: var(--mono); font-size: .86em; background: var(--bg-2);
        color: var(--amber-soft); padding: .1rem .35rem; border-radius: 3px; border: 1px solid var(--rule);
      }
      .prose pre {
        font-family: var(--mono); font-size: .86rem; line-height: 1.6;
        background: var(--bg-2) !important; border: 1px solid var(--rule);
        border-left: 2px solid var(--green); border-radius: 4px; padding: 1rem 1.1rem; overflow-x: auto;
      }
      .prose pre code { background: none !important; border: 0; padding: 0; }

      .footer {
        flex-shrink: 0; border-top: 1px solid var(--rule); font-family: var(--mono);
        font-size: .82rem; color: var(--fg-dim); padding-block: 1.6rem; margin-top: 3rem;
      }
      .footer__inner { display: flex; flex-wrap: wrap; gap: .6rem 1.5rem; align-items: baseline; }
      .footer a { color: var(--fg-dim); border-bottom: 0; }
      .footer a:hover { color: var(--bg); background: var(--amber); }

      @media (max-width: 620px) {
        body { font-size: 16px; }
        .filelist a { grid-template-columns: 1fr; gap: .15rem; padding-block: 1rem; }
      }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } * { transition: none !important; } }
    </style>
  </head>

  <body>
    <header class="topbar">
      <div class="wrap topbar__inner">
        <a class="prompt" href="#/"><span class="u">vishwak</span><span class="at">@</span><span class="h">blog</span><span class="p">:~</span><span class="s">$</span></a>
        <nav class="nav">
          <a href="#/">~</a>
          <a href="https://github.com/saivishwakgangam">github</a>
        </nav>
      </div>
    </header>

    <main id="app" class="wrap"><!-- rendered by JS --></main>

    <footer class="footer">
      <div class="wrap footer__inner">
        <span><span class="comment">$ whoami &mdash;</span> Sai Vishwak Gangam</span>
        <span style="margin-left:auto"><a href="https://github.com/saivishwakgangam">github</a></span>
      </div>
    </footer>

    <!-- markdown + syntax highlighting, loaded from a CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

    <script>
      /* =======================================================================
         YOUR POSTS  —  this is the only list you edit.
         To add a post:
           1. Put a new  .md  file in the  src/posts/  folder.
           2. Add a line to this list (newest at the top).
         ======================================================================= */
      const POSTS = [
        {
          file: "2026-07-19-binary-search-on-the-answer.md",
          title: "Binary search on the answer",
          date: "2026-07-19",
          category: "computer-science",
        },
        {
          file: "2026-08-30-good-will-hunting.md",
          title: "Good Will Hunting",
          date: "2026-08-30",
          category: "cinema",
        }
        // { file: "2026-08-01-my-next-post.md", title: "My next post", date: "2026-08-01", category: "thoughts" },
      ];
      /* ===================================================================== */

      const app = document.getElementById("app");

      function esc(s) {
        return String(s).replace(/[&<>"]/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])
        );
      }

      function renderHome() {
        const rows = POSTS.map(
          (p) => `
            <li>
              <a href="#/post/${encodeURIComponent(p.file)}">
                <span class="date">${esc(p.date)}</span>
                <span class="name">${esc(p.title)}</span>
                <span class="cat">--${esc(p.category)}</span>
              </a>
            </li>`
        ).join("");

        app.innerHTML = `
          <section>
            <div class="session">
              <p class="line"><span class="ps1">vishwak@blog:~$</span> whoami</p>
              <p class="out">Sai Vishwak Gangam — software engineer at Microsoft, based in Bengaluru.
                I write about computer science, software engineering, the fiction I'm reading, and stray thoughts.</p>
              <p class="line"><span class="ps1">vishwak@blog:~$</span> ls ~/posts <span class="comment"># newest first</span><span class="cursor">&#9608;</span></p>
            </div>
            <ul class="filelist">${rows}</ul>
          </section>`;
        document.title = "vishwak.log";
        window.scrollTo(0, 0);
      }

      async function renderPost(file) {
        const meta = POSTS.find((p) => p.file === file);
        app.innerHTML = `<p class="comment" style="font-family:var(--mono)">$ cat ${esc(file)} …</p>`;
        try {
          const res = await fetch("src/posts/" + file, { cache: "no-cache" });
          if (!res.ok) throw new Error(res.status);
          let md = await res.text();
          // strip an optional YAML front-matter block (--- ... ---) if present
          md = md.replace(/^\uFEFF?---\n[\s\S]*?\n---\n/, "");
          const html = marked.parse(md);
          app.innerHTML = `
            <article>
              <div class="crumb comment"><a href="#/">~/posts</a> / ${esc(file)}</div>
              <h1 class="post__title">${esc(meta ? meta.title : file)}</h1>
              <div class="post__meta">${meta ? esc(meta.date) + " · --" + esc(meta.category) : ""}</div>
              <div class="prose">${html}</div>
            </article>`;
          app.querySelectorAll("pre code").forEach((el) => {
            if (window.hljs) hljs.highlightElement(el);
          });
          document.title = (meta ? meta.title : file) + " — vishwak.log";
        } catch (e) {
          app.innerHTML = `
            <div class="crumb comment"><a href="#/">~/posts</a></div>
            <p class="prose">Couldn't load this post. If you're opening the file directly from your
            computer, the browser blocks loading the <code>.md</code> file. It works once the site is
            live on GitHub Pages, or if you run a local server (see the notes I sent).</p>`;
        }
        window.scrollTo(0, 0);
      }

      function route() {
        const hash = location.hash || "#/";
        const m = hash.match(/^#\/post\/(.+)$/);
        if (m) renderPost(decodeURIComponent(m[1]));
        else renderHome();
      }

      window.addEventListener("hashchange", route);
      route();
    </script>
  </body>
</html>
